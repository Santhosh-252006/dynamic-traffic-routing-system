server:
  port: 8085

spring:
  application:
    name: dynamic-traffic-routing
  datasource:
    url: jdbc:h2:mem:trafficdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: 9a2f8c4e6b1d3a5f7e9c2b4a6d8f1e3c5b7a9d2f4e6b8c1a3f5e7d9b2c4a6f8e
  expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.traffic: DEBUG
    org.springframework.security: INFO
