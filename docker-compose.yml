version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: traffic_postgres
    environment:
      POSTGRES_DB: trafficdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traffic_backend
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/trafficdb
      JWT_SECRET: 9a2f8c4e6b1d3a5f7e9c2b4a6d8f1e3c5b7a9d2f4e6b8c1a3f5e7d9b2c4a6f8e
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
